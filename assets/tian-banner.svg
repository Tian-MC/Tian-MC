<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="Tian. Building open-source software, self-hosted tools, and music experiences.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080d19"/>
      <stop offset="0.58" stop-color="#111126"/>
      <stop offset="1" stop-color="#21143c"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f6f1ff"/>
      <stop offset="0.56" stop-color="#ded0ff"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="arc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0.03"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.23"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse">
      <path d="M38 0H0V38" fill="none" stroke="#9c8cba" stroke-width="0.65" opacity="0.11"/>
    </pattern>
    <clipPath id="bounds"><rect width="1200" height="340" rx="24"/></clipPath>
  </defs>
  <g clip-path="url(#bounds)">
    <rect width="1200" height="340" fill="url(#bg)"/>
    <rect width="1200" height="340" fill="url(#grid)"/>
    <ellipse cx="934" cy="146" rx="370" ry="324" fill="url(#glow)"/>
    <rect x="0" y="0" width="1200" height="4" fill="#a78bfa"/>
    <path d="M75 67H100" stroke="#a78bfa" stroke-width="4" stroke-linecap="round"/>
    <text x="115" y="72" font-family="Arial, Helvetica, sans-serif" font-size="16" letter-spacing="4" font-weight="700" fill="#c0addf">DEVELOPER / SELF-HOSTER / MUSIC NERD</text>
    <text x="70" y="201" font-family="Arial, Helvetica, sans-serif" font-size="128" letter-spacing="-8" font-weight="800" fill="url(#title)">tian<tspan fill="#a78bfa">.</tspan></text>
    <text x="75" y="252" font-family="Arial, Helvetica, sans-serif" font-size="21" letter-spacing="0.9" fill="#d0c5e6">Building software that feels like mine.</text>
    <path d="M75 284H523" stroke="#74658f" stroke-width="1" opacity="0.5"/>
    <text x="75" y="310" font-family="monospace" font-size="15" letter-spacing="1.2" fill="#a999c9">BUILD IT  ·  OWN IT  ·  IMPROVE IT</text>
    <!-- Decorative record, equalizer and code-like blocks: abstract on purpose -->
    <circle cx="979" cy="164" r="202" stroke="url(#arc)" stroke-width="1.8" fill="none"/>
    <circle cx="979" cy="164" r="162" stroke="url(#arc)" stroke-width="1.8" fill="none"/>
    <circle cx="979" cy="164" r="124" stroke="#a78bfa" stroke-width="1.2" stroke-opacity="0.27" fill="none"/>
    <circle cx="979" cy="164" r="87" stroke="#a78bfa" stroke-width="1.1" stroke-opacity="0.4" fill="none"/>
    <circle cx="979" cy="164" r="41" stroke="#a78bfa" stroke-width="1.2" stroke-opacity="0.62" fill="none"/>
    <circle cx="979" cy="164" r="8" fill="#c4b5fd"/>
    <path d="M695 190Q770 65 837 162T973 161T1130 145T1230 147" fill="none" stroke="#a78bfa" stroke-width="2.5" opacity="0.72"/>
    <path d="M670 213Q748 91 825 188T975 188T1134 164T1229 183" fill="none" stroke="#6d5caa" stroke-width="1.2" opacity="0.55"/>
    <g fill="#c4b5fd" opacity="0.62">
      <rect x="690" y="149" width="5" height="18" rx="2"/><rect x="702" y="129" width="5" height="58" rx="2"/>
      <rect x="714" y="138" width="5" height="39" rx="2"/><rect x="726" y="115" width="5" height="88" rx="2"/>
      <rect x="738" y="146" width="5" height="25" rx="2"/><rect x="750" y="121" width="5" height="79" rx="2"/>
      <rect x="762" y="152" width="5" height="13" rx="2"/>
    </g>
    <g font-family="monospace" font-size="13" letter-spacing="0.9" fill="#b9a6d6" opacity="0.65">
      <text x="884" y="48">[ audio / infra / code ]</text>
      <text x="970" y="304">010100  //  LOCAL FIRST</text>
    </g>
    <path d="M1080 75h45m-10 -10 10 10 -10 10" fill="none" stroke="#ba9ef5" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/>
  </g>
</svg>
